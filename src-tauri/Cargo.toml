[package]
name = "chilly"
version = "0.2.4"
description = "Twitch desktop client for Windows with live notifications, multistream, chat and auto-claim"
authors = ["SamppaLandia"]
license = "MIT"
homepage = "https://samppalandia.wtf/chilly/"
repository = "https://github.com/SamppaPappa/chilly"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
rodio = "0.20"
anyhow = "1"
arboard = { version = "3", default-features = false }
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Globalization"] }
winreg = "0.55"

[profile.release]
opt-level = 3
lto = false
strip = "none"
