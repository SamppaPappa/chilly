# Chillyn julkaisupaketit GitHubin palvelimilla.
# Käynnistyy kun pushataan tagi v* (esim. git tag v0.2.3 && git push origin v0.2.3)
# tai käsin Actions-välilehdeltä ("Run workflow").
# Tulos: LUONNOS-julkaisu (draft) GitHub Releasesiin, jossa allekirjoitettu Windows-asennin + .sig
# ja Linux-paketit. Sivulle vienti: tools/hae-julkaisu.ps1 + tools/julkaise.py.
name: Julkaisu

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rakenna:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nimi: Windows
            bundles: nsis
          - os: ubuntu-24.04
            nimi: Linux
            bundles: deb,appimage
    name: ${{ matrix.nimi }}
    runs-on: ${{ matrix.os }}
    # Linux-portti on kesken: Linux-käännöksen virhe ei kaada Windows-julkaisua
    continue-on-error: ${{ matrix.nimi == 'Linux' }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-kirjastot
        if: matrix.nimi == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: Chilly __VERSION__
          releaseBody: Automaattinen rakennus. Muutokset sivun muutoslokissa.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: --bundles ${{ matrix.bundles }}
